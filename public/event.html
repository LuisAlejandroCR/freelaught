<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freelaught — Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="container nav">
    <a class="brand" href="/"><span class="brand-dot"></span>Freelaught</a>
    <div class="nav-links">
      <a href="/">Shows</a>
      <a href="/vip">VIP</a>
    </div>
  </div>
</header>

<main class="container" id="main">
  <div class="skeleton">Cargando show…</div>
</main>

<footer>
  <div class="container">Freelaught — hackathon Boom × FreeTicket. Forecast y Pareto generados por el pipeline local.</div>
</footer>

<script src="/app.js"></script>
<script>
const eventId = location.pathname.split("/").filter(Boolean)[1];

async function load() {
  try {
    const e = await getJSON(`/api/events/${eventId}`);

    const fillPct = e.fill_rate_expected !== null ? (e.fill_rate_expected * 100).toFixed(0) : null;
    const typeEntries = Object.entries(e.ticket_type_mix).sort((a, b) => b[1] - a[1]);
    const typeTotal = typeEntries.reduce((s, [, c]) => s + c, 0);

    $("#main").innerHTML = `
      <a href="/" style="color:var(--muted);font-size:13px">← Todos los shows</a>

      <div class="hero" style="margin-top:18px">
        <div>
          <h1>${e.title}</h1>
          <div class="hero-badges">
            <span class="badge yellow">${e.artist_name}</span>
            <span class="badge gray">${e.venue} · ${e.city}</span>
            <span class="badge gray">${e.weekday} · ${fmtDay(e.starts_at)}</span>
            ${e.is_residency ? '<span class="badge teal">residencia</span>' : ""}
          </div>
        </div>
        <div style="text-align:right">
          <div class="big-num mono">${fmtInt(e.expected_attendance)}</div>
          <div class="range mono">rango [<b>${fmtInt(e.p10)}</b> – <b>${fmtInt(e.p90)}</b>]</div>
          <button class="wa-btn" id="share-btn" aria-label="Compartir este show por WhatsApp" title="Copiar enlace WhatsApp">
            <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.04 3C9.13 3 3.5 8.63 3.5 15.54c0 2.21.58 4.37 1.68 6.27L3.5 29l7.38-1.94a12.4 12.4 0 0 0 5.16 1.1h.01c6.9 0 12.53-5.63 12.53-12.54 0-3.35-1.3-6.5-3.67-8.87A12.43 12.43 0 0 0 16.04 3zm0 22.97c-1.88 0-3.72-.51-5.33-1.46l-.38-.23-4.38 1.15 1.17-4.27-.25-.4a10.4 10.4 0 0 1-1.6-5.52c0-5.76 4.69-10.45 10.46-10.45 2.79 0 5.41 1.09 7.39 3.07a10.4 10.4 0 0 1 3.06 7.39c0 5.77-4.69 10.46-10.45 10.46h-.09zm5.74-7.83c-.31-.16-1.86-.92-2.15-1.02-.29-.11-.5-.16-.71.16-.21.31-.82 1.02-1 1.23-.19.21-.37.23-.68.08-.31-.16-1.32-.49-2.52-1.55-.93-.83-1.56-1.85-1.74-2.16-.19-.31-.02-.48.14-.63.14-.14.31-.37.47-.55.16-.18.21-.31.31-.52.11-.21.05-.39-.03-.55-.08-.16-.71-1.7-.97-2.33-.25-.61-.51-.53-.71-.54h-.6c-.21 0-.55.08-.83.39-.29.31-1.1 1.07-1.1 2.61 0 1.54 1.12 3.03 1.28 3.24.16.21 2.21 3.37 5.35 4.73.75.32 1.33.52 1.79.66.75.24 1.43.21 1.97.13.6-.09 1.86-.76 2.12-1.5.26-.74.26-1.37.18-1.5-.08-.14-.29-.21-.6-.37z"/></svg>
          </button>
          <div class="share-caption">Compartir este show</div>
          <div class="share-meta" id="share-meta"></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="section-title" style="margin-top:0">Asistencia esperada</div>
          <div class="stat-line"><span class="k">Tickets vendidos</span><span class="v mono">${fmtInt(e.tickets_sold)}</span></div>
          <div class="stat-line"><span class="k">Capacidad</span><span class="v mono">${fmtInt(e.capacity)}</span></div>
          <div class="stat-line"><span class="k">Llenado esperado</span><span class="v mono">${fillPct === null ? "—" : fillPct + "%"}</span></div>
          <div class="stat-line"><span class="k">Staff sugerido</span><span class="v mono">${e.suggested_staff} personas</span></div>
          <div class="panel-note">Heurística simple: 1 persona por cada 40 asistentes esperados + 2 de base. No es un modelo de staffing real.</div>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0">Mezcla de tickets</div>
          ${typeEntries.length ? typeEntries.map(([type, count]) => `
            <div class="mix-row">
              <span class="mix-lab">${type}</span>
              <div class="bar-track"><div class="bar-fill teal" style="width:${Math.min(100, Math.max(0, (count / typeTotal) * 100))}%"></div></div>
              <span class="mix-pct mono">${((count / typeTotal) * 100).toFixed(0)}% · ${count}</span>
            </div>`).join("") : '<div class="empty">Sin tickets registrados</div>'}
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="section-title" style="margin-top:0">Invitados VIP que vienen</div>
        ${e.vip_guests.length ? e.vip_guests.map((g) => `
          <div class="vip-row">
            <div class="vip-info">
              <div class="vip-name">${g.name}</div>
              <div class="vip-meta">afinidad: <b>${g.weekday_affinity}</b> · ${g.points} puntos</div>
            </div>
            <span class="badge ${g.weekday_affinity.includes("sábado") || g.weekday_affinity.includes("viernes") ? "teal" : "gray"}">${g.weekday_affinity}</span>
          </div>`).join("") : '<div class="empty">Sin VIP identificados en este show</div>'}
        <div class="panel-note">Top 20% por ingreso del cohorte de invitados identificados (ver /vip).</div>
      </div>
    `;

    const st = shareState();
    const meta = $("#share-meta");
    const liveHost = location.hostname !== "localhost" && location.hostname !== "127.0.0.1";
    if (st.expired) {
      meta.innerHTML = '<span class="expired">Enlace expirado</span> — regenéralo abriendo esta página de nuevo (demo: expiración en el cliente, sin revocación en servidor).';
      $("#share-btn").disabled = true;
    } else {
      const expiry = `El enlace expira en ${fmtLeft(st.left)}`;
    }
    $("#share-btn").addEventListener("click", () => {
      const text = `🎟️ ${e.title} en ${e.venue} (${fmtDay(e.starts_at)}) — asistencia esperada: ${fmtInt(e.expected_attendance)} personas. ¿Vienes?`;
      const url = waShareUrl(text, location.origin + location.pathname);
      navigator.clipboard.writeText(url).then(() => {
        const prev = meta.textContent;
        meta.textContent = "¡Enlace copiado! Pégalo en WhatsApp.";
        setTimeout(() => (meta.textContent = prev), 2000);
      });
    });
  } catch (err) {
    renderError($("#main"), err);
  }
}
load();
</script>
</body>
</html>
