<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freelaught — Shows de agosto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="container nav">
    <a class="brand" href="/"><span class="brand-dot"></span>Freelaught</a>
    <div class="nav-links">
      <a href="/" class="active">Shows</a>
      <a href="/vip">VIP</a>
    </div>
  </div>
</header>

<main class="container">
  <h1>Agosto en 30 shows</h1>
  <div class="sub">Asistencia esperada por show, rango de confianza y staffing sugerido.</div>

  <div class="kpis" id="kpis">
    <div class="kpi"><div class="kpi-lab">Cargando…</div></div>
  </div>

  <!-- Recomendación va inmediatamente después del estado (KPIs) — es la
       respuesta a "¿dónde me enfoco?". El resultado del cruce (metodología /
       confianza de los datos) va DESPUÉS: es contexto de soporte, no la
       recomendación en sí, y no debe competir por el mismo espacio. -->
  <div class="card" id="focus-card" style="margin-top:16px; display:none">
    <div class="section-title" style="margin-top:0; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap">
      <span>Recomendación — foco por día</span>
      <div class="filter-tabs" id="focus-metric-filter">
        <button data-v="expected" class="active">Asistencia esperada</button>
        <button data-v="vip">Top VIP</button>
      </div>
    </div>
    <div class="panel-note" id="focus-subtitle" style="margin-top:-6px; margin-bottom:14px"></div>
    <div class="focus-lead" id="focus-lead"></div>
    <div class="focus-list" id="focus-list"></div>
  </div>

  <div class="card" id="match-result-card" style="margin-top:16px">
    <div class="section-title" style="margin-top:0">Resultado del cruce (Boom × FreeTicket)</div>
    <div class="segbar" id="match-segbar"></div>
    <div class="seg-legend" id="match-legend"></div>
  </div>

  <div class="card" id="filters-card" style="margin-top:16px; display:none">
    <div class="filters-row">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar show, artista o venue…" />
      <div class="filter-tabs" id="weekday-filter"></div>
      <div class="filter-tabs" id="residency-filter">
        <button data-v="all" class="active">Todos</button>
        <button data-v="residency">Residencia</button>
        <button data-v="unique">Único</button>
      </div>
    </div>
    <div class="panel-note" id="filter-summary" style="margin-top:10px; margin-bottom:0"></div>
  </div>

  <div id="table-area" class="skeleton">Cargando shows…</div>
</main>

<footer>
  <div class="container">Freelaught — hackathon Boom × FreeTicket. Forecast y Pareto generados por el pipeline local.</div>
</footer>

<script src="/app.js"></script>
<script>
async function load() {
  try {
    const [events, vip, stats] = await Promise.all([getJSON("/api/events"), getJSON("/api/vip"), getJSON("/api/stats")]);

    const totalExpected = events.reduce((s, e) => s + e.expected_attendance, 0);
    const withCap = events.filter((e) => e.capacity);
    const avgFill = withCap.length
      ? (withCap.reduce((s, e) => s + Math.min(1, e.expected_attendance / e.capacity), 0) / withCap.length) * 100
      : 0;

    // Weekday order (ascending, calendar order) — shared by the "foco por
    // día" recommendation and the weekday filter chips below. Only days that
    // actually have a show in the data get a chip/column.
    const WEEKDAY_ORDER = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];
    const daysPresent = WEEKDAY_ORDER.filter((d) => events.some((e) => e.weekday === d));
    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    // "Foco por día" — answers "where should I focus?" instead of just
    // listing data. One lead recommendation (the single best show for the
    // selected metric, with a why-delta vs. the August average), then a
    // compact list with one row per day (top show) and #2/#3 tucked behind
    // an expand toggle — not 15 always-visible rows. Bars are scaled to the
    // GLOBAL max across all 30 shows, not per-day, so a bar's length means
    // the same thing everywhere on the page (a per-day max made two visually
    // identical bars represent a 123 and a 376 — misleading).
    const byWeekday = new Map();
    for (const e of events) {
      if (!byWeekday.has(e.weekday)) byWeekday.set(e.weekday, []);
      byWeekday.get(e.weekday).push(e);
    }
    const FOCUS_METRICS = {
      expected: {
        key: "expected_attendance",
        label: "Asistencia esperada",
        unit: "asist.",
        subtitle: "Ranking por asistencia esperada — foco operativo: dónde concentrar staff y logística.",
        barClass: "",
      },
      vip: {
        key: "vip_guest_count",
        label: "Invitados VIP confirmados",
        unit: "VIP",
        subtitle: "Ranking por invitados VIP confirmados — foco de fidelización: dónde cuidar al invitado recurrente.",
        barClass: "purple",
      },
    };
    let focusMetric = "expected";

    function renderFocus() {
      const m = FOCUS_METRICS[focusMetric];
      $("#focus-subtitle").textContent = m.subtitle;

      const allValues = events.map((e) => e[m.key]);
      const avg = allValues.reduce((s, v) => s + v, 0) / allValues.length;
      const globalMax = Math.max(1, ...allValues);

      function delta(v) {
        if (avg <= 0) return { label: "sin promedio", up: true };
        const d = Math.round(((v - avg) / avg) * 100);
        return { label: `${d >= 0 ? "+" : ""}${d}% vs. prom.`, up: d >= 0 };
      }
      function itemRow(e) {
        const dl = delta(e[m.key]);
        const barPct = Math.max(4, (e[m.key] / globalMax) * 100);
        return `
          <a class="focus-item-body" href="/events/${e.event_id}">
            <span class="focus-item-title">${e.title}</span>
            <div class="bar-track focus-item-bar"><div class="bar-fill${m.barClass ? " " + m.barClass : ""}" style="width:${barPct}%"></div></div>
          </a>
          <div class="focus-item-value">
            <div class="n mono">${fmtInt(e[m.key])}<span class="unit"> ${m.unit}</span></div>
            <div class="delta ${dl.up ? "up" : "down"}">${dl.label}</div>
          </div>`;
      }

      const dayTops = daysPresent.map((day) => {
        const sorted = [...byWeekday.get(day)].sort((a, b) => b[m.key] - a[m.key]);
        return { day, top: sorted[0], rest: sorted.slice(1, 3) };
      });

      $("#focus-list").innerHTML = dayTops
        .map(
          ({ day, top, rest }) => `
        <div class="focus-item">
          <div class="focus-item-main">
            <div class="focus-day-tag">${capitalize(day)}</div>
            ${itemRow(top)}
            ${
              rest.length
                ? `<button class="focus-expand-btn" type="button" data-day="${day}">+${rest.length} más</button>`
                : `<span class="focus-expand-spacer"></span>`
            }
          </div>
          ${rest.map((e) => `<div class="focus-sub" data-day="${day}" hidden>${itemRow(e)}</div>`).join("")}
        </div>`
        )
        .join("");

      $("#focus-list")
        .querySelectorAll(".focus-expand-btn")
        .forEach((btn) => {
          btn.addEventListener("click", () => {
            const subs = $("#focus-list").querySelectorAll(`.focus-sub[data-day="${btn.dataset.day}"]`);
            const willShow = subs[0].hidden;
            subs.forEach((s) => (s.hidden = !willShow));
            btn.textContent = willShow ? "ocultar" : `+${subs.length} más`;
          });
        });

      // Lead recommendation: the single best show across the whole week for
      // this metric — the answer, not just another data point.
      const lead = dayTops.reduce((a, b) => (b.top[m.key] > a.top[m.key] ? b : a));
      const leadDelta = delta(lead.top[m.key]);
      $("#focus-lead").innerHTML = `
        <div class="n mono${m.barClass ? " " + m.barClass : ""}">${fmtInt(lead.top[m.key])}</div>
        <div class="focus-lead-body">
          <div class="focus-lead-tag">Foco de la semana · ${capitalize(lead.day)}</div>
          <div class="focus-lead-title">${lead.top.title}</div>
          <div class="focus-lead-why">${m.label} ${leadDelta.label.replace("vs. prom.", "vs. el promedio de agosto")} (${fmtInt(Math.round(avg))} ${m.unit} en promedio)</div>
        </div>`;
    }
    renderFocus();
    $("#focus-metric-filter")
      .querySelectorAll("button")
      .forEach((btn) => {
        btn.addEventListener("click", () => {
          focusMetric = btn.dataset.v;
          $("#focus-metric-filter")
            .querySelectorAll("button")
            .forEach((b) => b.classList.toggle("active", b === btn));
          renderFocus();
        });
      });
    $("#focus-card").style.display = "block";

    // "Show más grande" ya no es un KPI aparte — el banner de "foco por día"
    // dice lo mismo con más contexto (día, por qué, delta vs. promedio), así
    // que mantenerlo aquí solo duplicaba el mismo dato con menos información.
    $("#kpis").innerHTML = `
      <div class="kpi"><div class="kpi-num mono">${fmtInt(totalExpected)}</div><div class="kpi-lab">asistentes esperados · agosto</div></div>
      <div class="kpi"><div class="kpi-num mono">${avgFill.toFixed(0)}<span class="kpi-suf">%</span></div><div class="kpi-lab">llenado promedio esperado</div></div>
      <div class="kpi teal"><div class="kpi-num mono">${vip.vipRevenueSharePct.toFixed(1)}<span class="kpi-suf">%</span></div><div class="kpi-lab">ingreso en manos del top 20% VIP</div></div>
    `;

    const unmatched = stats.totalSales - stats.matched;
    const segments = [
      { label: "Alta confianza", count: stats.high, color: "var(--teal)" },
      { label: "Confianza media", count: stats.medium, color: "var(--primary)" },
      { label: "Sin match", count: unmatched, color: "var(--muted-2)" },
    ];
    $("#match-segbar").innerHTML = segments
      .map((s) => `<div style="width:${((s.count / stats.totalSales) * 100).toFixed(2)}%; background:${s.color}"></div>`)
      .join("");
    $("#match-legend").innerHTML = segments
      .map(
        (s) =>
          `<div class="seg-legend-item"><span class="dot" style="background:${s.color}"></span>${s.label}<b class="mono">${fmtInt(s.count)}</b><span class="pct">${((s.count / stats.totalSales) * 100).toFixed(0)}%</span></div>`
      )
      .join("");

    const table = document.createElement("div");
    table.className = "table-wrap";
    table.innerHTML = `
      <table>
        <thead>
          <tr>
            <th data-sort="title">Show</th>
            <th data-sort="venue">Venue</th>
            <th data-sort="weekday">Día</th>
            <th data-sort="date">Fecha</th>
            <th data-sort="expected" data-type="num">Esperado</th>
            <th data-sort="fill" data-type="num">Llenado</th>
            <th data-sort="staff" data-type="num">Staff</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>`;
    $("#table-area").replaceWith(table);

    const tbody = table.querySelector("tbody");
    tbody.addEventListener("click", (e) => {
      const tr = e.target.closest("tr");
      if (!tr) return;
      if (e.target.closest("a")) return;
      location.href = `/events/${tr.dataset.id}`;
    });
    for (const e of events) {
      const tr = document.createElement("tr");
      tr.dataset.id = e.event_id;
      const fillPct = e.fill_rate_expected !== null ? e.fill_rate_expected * 100 : null;
      const residency = e.is_residency ? '<span class="badge teal" style="margin-left:6px">residencia</span>' : "";
      tr.dataset.title = e.title.toLowerCase();
      tr.dataset.venue = e.venue.toLowerCase();
      tr.dataset.artist = e.artist_name.toLowerCase();
      tr.dataset.weekday = e.weekday;
      tr.dataset.residency = e.is_residency ? "residency" : "unique";
      tr.dataset.date = e.starts_at;
      tr.dataset.expected = e.expected_attendance;
      tr.dataset.fill = fillPct === null ? -1 : fillPct;
      tr.dataset.staff = e.suggested_staff;
      tr.innerHTML = `
        <td class="title-cell"><a class="rowlink" href="/events/${e.event_id}"><strong>${e.title}</strong><span>${e.artist_name}${residency}</span></a></td>
        <td>${e.venue} <span style="color:var(--muted);font-size:12px">· ${e.city}</span></td>
        <td>${e.weekday}</td>
        <td class="mono">${e.starts_at.slice(0, 10)}</td>
        <td class="num"><a class="rowlink" href="/events/${e.event_id}"><strong style="font-size:15px">${fmtInt(e.expected_attendance)}</strong><br><span style="color:var(--muted);font-size:11.5px">[${fmtInt(e.p10)}–${fmtInt(e.p90)}]</span></a></td>
        <td>${
          fillPct === null
            ? '<span style="color:var(--muted)">—</span>'
            : `<div class="bar-track"><div class="bar-fill${fillPct >= 85 ? " orange" : ""}" style="width:${Math.min(100, Math.max(0, fillPct))}%"></div></div><span class="mono" style="font-size:12px;margin-left:8px;color:${fillPct >= 85 ? "var(--orange)" : "var(--muted)"}">${fillPct.toFixed(0)}%</span>`
        }</td>
        <td class="num"><span class="chip mono">${e.suggested_staff} pax</span></td>`;
      tbody.appendChild(tr);
    }
    makeSortable(table.querySelector("table"));

    // Filters — weekday chips built from days actually present in the data
    // (WEEKDAY_ORDER/daysPresent computed above, shared with the "foco por
    // día" card), search + residency toggle. Rows already carry the
    // dataset.* attributes makeSortable() uses, so filtering just toggles
    // display:none and leaves sort untouched (no re-render, no fight over
    // row order).
    const filterState = { search: "", weekday: "all", residency: "all" };
    const allRows = [...tbody.querySelectorAll("tr")];

    $("#weekday-filter").innerHTML =
      `<button data-v="all" class="active">Todos</button>` +
      daysPresent.map((d) => `<button data-v="${d}">${capitalize(d)}</button>`).join("");

    function applyFilters() {
      let visible = 0;
      for (const tr of allRows) {
        const matchesSearch =
          !filterState.search ||
          tr.dataset.title.includes(filterState.search) ||
          tr.dataset.venue.includes(filterState.search) ||
          tr.dataset.artist.includes(filterState.search);
        const matchesWeekday = filterState.weekday === "all" || tr.dataset.weekday === filterState.weekday;
        const matchesResidency = filterState.residency === "all" || tr.dataset.residency === filterState.residency;
        const show = matchesSearch && matchesWeekday && matchesResidency;
        tr.style.display = show ? "" : "none";
        if (show) visible++;
      }
      $("#filter-summary").textContent =
        visible === events.length ? `${events.length} shows` : `${visible} de ${events.length} shows`;
    }

    function initTabGroup(containerId, key) {
      const container = $(containerId);
      container.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          filterState[key] = btn.dataset.v;
          container.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
          applyFilters();
        });
      });
    }
    initTabGroup("#weekday-filter", "weekday");
    initTabGroup("#residency-filter", "residency");

    $("#search-input").addEventListener("input", (e) => {
      filterState.search = e.target.value.trim().toLowerCase();
      applyFilters();
    });

    $("#filters-card").style.display = "block";
    applyFilters();
  } catch (err) {
    renderError($("#table-area"), err);
  }
}
load();
</script>
</body>
</html>
